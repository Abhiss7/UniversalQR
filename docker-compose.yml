version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: universalqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-universalqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-universalqr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-universalqr_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-universalqr} -d ${POSTGRES_DB:-universalqr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis for session / rate limiting (optional for Phase 0)
  # redis:
  #   image: redis:7-alpine
  #   container_name: universalqr-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

volumes:
  postgres_data:
    name: universalqr_postgres_data
